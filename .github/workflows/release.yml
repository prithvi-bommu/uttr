name: Release

# Two publish paths:
#   1. Every push (merge) to main  -> rebuild the DMG and update the rolling
#      "latest" prerelease, so the newest build is always downloadable.
#   2. Version tags (v1.2.3)       -> a permanent, versioned release.
#
# Downloads are public once the repository is public; on a private repo,
# releases are visible to collaborators only.
#
# Every published app is Developer ID signed, notarized, and stapled. This is
# required for a stable app identity across Sparkle updates and for Gatekeeper.
# The workflow fails closed when signing/notarization credentials are missing.
#
# Sparkle archive signatures use SPARKLE_PRIVATE_KEY. Before publishing, CI
# verifies that signature against SUPublicEDKey from the built app, preventing
# a mismatched update key from reaching installed clients.

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create/update releases and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build DMG & Publish
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Resolve packages
        run: |
          xcodebuild -project Uttr.xcodeproj \
            -scheme Uttr \
            -resolvePackageDependencies

      - name: Import Developer ID signing certificate
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          test -n "$DEVELOPER_ID_APPLICATION_P12_BASE64" || {
            echo "Missing DEVELOPER_ID_APPLICATION_P12_BASE64 repository secret." >&2
            exit 1
          }
          test -n "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" || {
            echo "Missing DEVELOPER_ID_APPLICATION_P12_PASSWORD repository secret." >&2
            exit 1
          }

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/uttr-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          test -n "$IDENTITY" || {
            echo "No Developer ID Application identity was found in the imported certificate." >&2
            exit 1
          }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
        id: signing

      - name: Build Release app
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID" || {
            echo "Missing APPLE_TEAM_ID repository variable." >&2
            exit 1
          }
          xcodebuild build \
            -project Uttr.xcodeproj \
            -scheme Uttr \
            -configuration Release \
            -derivedDataPath build/release \
            -destination "platform=macOS,arch=arm64" \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.identity }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Verify Developer ID signing
        run: |
          APP="build/release/Build/Products/Release/Uttr.app"
          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -q "Authority=Developer ID Application" || {
            echo "Uttr.app is not signed with a Developer ID Application certificate." >&2
            exit 1
          }

      - name: Package DMG
        id: dmg
        run: |
          APP="build/release/Build/Products/Release/Uttr.app"
          VERSION=$(defaults read "$(pwd)/$APP/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "0.0.0")
          BUILD=$(defaults read "$(pwd)/$APP/Contents/Info" CFBundleVersion 2>/dev/null || echo "0")
          ./Scripts/make-dmg.sh "$APP" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "dmg=build/Uttr-$VERSION.dmg" >> "$GITHUB_OUTPUT"
          echo "sha=build/Uttr-$VERSION.dmg.sha256" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMG
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_ID" || { echo "Missing APP_STORE_CONNECT_API_KEY_ID." >&2; exit 1; }
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo "Missing APP_STORE_CONNECT_ISSUER_ID." >&2; exit 1; }
          test -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64" || { echo "Missing APP_STORE_CONNECT_API_KEY_P8_BASE64." >&2; exit 1; }

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          DMG="${{ steps.dmg.outputs.dmg }}"

          xcrun notarytool submit "$DMG" \
            --key "$API_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t open "$DMG"
          shasum -a 256 "$DMG" > "${DMG}.sha256"

      - name: Cache Sparkle tools
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: sparkle-cache
        uses: actions/cache@v4
        with:
          path: sparkle-tools
          key: sparkle-tools-2.9.5

      - name: Download Sparkle tools
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.sparkle-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sparkle-tools
          curl -L -o sparkle-tools/Sparkle-2.9.5.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-2.9.5.tar.xz"
          cd sparkle-tools && tar xf Sparkle-2.9.5.tar.xz

      - name: Sign DMG and generate appcast
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Write the private key to a temp file — never interpolate into command line.
          KEY_FILE="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          DMG="${{ steps.dmg.outputs.dmg }}"
          VERSION="${{ steps.dmg.outputs.version }}"
          BUILD="${{ steps.dmg.outputs.build }}"

          # Sign the DMG and capture the signature attributes.
          SIG_OUTPUT=$(./sparkle-tools/bin/sign_update -f "$KEY_FILE" "$DMG")
          echo "Signature output: $SIG_OUTPUT"

          # Parse signature from the output (BSD grep compatible).
          ED_SIG=$(echo "$SIG_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          test -n "$ED_SIG" || {
            echo "Sparkle did not emit an EdDSA signature." >&2
            exit 1
          }
          PUBLIC_KEY=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "build/release/Build/Products/Release/Uttr.app/Contents/Info.plist")
          swift Scripts/verify-sparkle-signature.swift "$PUBLIC_KEY" "$ED_SIG" "$DMG"
          LENGTH=$(stat -f%z "$DMG" 2>/dev/null || stat --printf="%s" "$DMG")

          # Determine download URL.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            DL_URL="https://github.com/prithvi-bommu/uttr/releases/download/$TAG/Uttr-$VERSION.dmg"
          else
            DL_URL="https://github.com/prithvi-bommu/uttr/releases/download/latest/Uttr-$VERSION.dmg"
          fi

          PUB_DATE=$(date -u '+%a, %d %b %Y %H:%M:%S %z')

          cat > build/appcast.xml <<APPCAST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Uttr</title>
              <item>
                <title>Uttr $VERSION</title>
                <pubDate>$PUB_DATE</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <description><![CDATA[<p>Uttr $VERSION (build $BUILD)</p>]]></description>
                <enclosure url="$DL_URL"
                           sparkle:edSignature="$ED_SIG"
                           length="$LENGTH"
                           type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          APPCAST_EOF

          # Strip leading whitespace from heredoc indentation.
          sed -i '' 's/^          //' build/appcast.xml 2>/dev/null || sed -i 's/^          //' build/appcast.xml

          # Validate XML.
          xmllint --noout build/appcast.xml

          # Clean up key file.
          rm -f "$KEY_FILE"

          echo "appcast=build/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Publish rolling "latest" release (main merges)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automated build of main @ ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%d)).

          Signed and notarized with Developer ID. Verify integrity with the attached .sha256 file.
          "
          # Recreate the rolling release so its tag always points at this commit.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          ASSETS=("${{ steps.dmg.outputs.dmg }}" "${{ steps.dmg.outputs.sha }}")
          if [ -f build/appcast.xml ]; then
            ASSETS+=("build/appcast.xml")
          fi

          gh release create latest \
            --prerelease \
            --title "Latest build (main)" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            "${ASSETS[@]}"

      - name: Publish versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          ASSETS=("${{ steps.dmg.outputs.dmg }}" "${{ steps.dmg.outputs.sha }}")
          if [ -f build/appcast.xml ]; then
            ASSETS+=("build/appcast.xml")
          fi

          gh release create "$TAG" \
            --title "Uttr $TAG" \
            --generate-notes \
            "${ASSETS[@]}"

      - name: Publish appcast to GitHub Pages
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && hashFiles('build/appcast.xml') != ''
        run: |
          mkdir -p build/pages
          cp build/appcast.xml build/pages/appcast.xml

      - name: Deploy to gh-pages
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && hashFiles('build/appcast.xml') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: build/pages
          publish_branch: gh-pages
