name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Resolve packages
        run: |
          xcodebuild -project Uttr.xcodeproj \
            -scheme Uttr \
            -resolvePackageDependencies

      - name: Run tests
        run: |
          xcodebuild test \
            -project Uttr.xcodeproj \
            -scheme Uttr \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive
        run: |
          xcodebuild archive \
            -project Uttr.xcodeproj \
            -scheme Uttr \
            -configuration Release \
            -archivePath build/Uttr.xcarchive \
            ARCHS=arm64

      - name: Export
        run: |
          echo "Release archive created. Manual signing/notarization required."
          echo "See docs/RELEASE.md for the full runbook."
